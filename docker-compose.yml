# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodlek
      POSTGRES_PASSWORD: foodlek
      POSTGRES_DB: foodlek
    ports:
      - "5432:5432"
    volumes:
      - foodlek-db:/var/lib/postgresql/data
      - ./scripts/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  foodlek-db:
